name: Docker

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - .dockerignore
      - Dockerfile
      - Cargo.lock
      - Cargo.toml
      - pyproject.toml
      - .github/workflows/docker.yml
      - .github/workflows/cleanup-images.yml
      - bindings/python/**
      - engine/**
      - training/**

# Let the running build finish; only the latest queued build survives.
# When commits A, B, C land quickly: CI cancels A and B (cancel-in-progress
# in ci.yml), only C's CI completes and triggers this workflow. If a Docker
# build is already running when a new CI completes, the new run queues —
# and any further triggers replace that queued run rather than stacking up.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('docker-pr-{0}', github.event.pull_request.number) || 'docker' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Temporary PR smoke build for image-build tuning. This does not publish
  # runtime image tags; merge builds below remain the only publishing path.
  # CUDA skips PR cache export because uploading its full dependency layer to
  # the GitHub Actions cache is slower than rebuilding it for smoke checks.
  pr-build:
    name: PR Build ${{ matrix.variant }}-${{ matrix.arch }}
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            arch: amd64
            runner: ubuntu-24.04
          - variant: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: cuda
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ghcr.io/k15z/hexchess-zero/training
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build image
        if: matrix.variant != 'cuda'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false
          build-args: TORCH_VARIANT=${{ matrix.variant == 'cuda' && 'cu126' || 'cpu' }}
          cache-from: |
            type=gha,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }}
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
            type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: Build CUDA image
        if: matrix.variant == 'cuda'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          provenance: false
          build-args: TORCH_VARIANT=cu126
          cache-from: |
            type=gha,scope=pr-${{ github.event.pull_request.number }}-${{ matrix.variant }}-${{ matrix.arch }}
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
            type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}

  # Build each platform natively in parallel (no QEMU emulation)
  build:
    name: Build ${{ matrix.variant }}-${{ matrix.arch }}
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: cpu
            arch: amd64
            runner: ubuntu-24.04
          - variant: cpu
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: cuda
            arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/k15z/hexchess-zero/training
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: build
        if: matrix.variant != 'cuda'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: TORCH_VARIANT=${{ matrix.variant == 'cuda' && 'cu126' || 'cpu' }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:${{ matrix.variant }}
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
            type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }},mode=max
      - name: Build and push CUDA by digest
        id: build-cuda
        if: matrix.variant == 'cuda'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          build-args: TORCH_VARIANT=cu126
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:${{ matrix.variant }}
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.variant }}-${{ matrix.arch }}
            type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=inline
      - name: Export digest
        run: |
          mkdir -p /tmp/digests/${{ matrix.variant }}
          digest="${{ steps.build.outputs.digest || steps.build-cuda.outputs.digest }}"
          touch "/tmp/digests/${{ matrix.variant }}/${digest#sha256:}"
      - uses: actions/upload-artifact@v5
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 1

  # Merge per-arch images into multi-arch manifests
  publish:
    name: Publish ${{ matrix.variant }} manifest
    needs: build
    if: github.event_name == 'workflow_run'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: [cpu, cuda]
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/k15z/hexchess-zero/training
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v5
        with:
          pattern: digest-${{ matrix.variant }}-*
          path: /tmp/digests/${{ matrix.variant }}
          merge-multiple: true
      - name: Create manifest and push
        working-directory: /tmp/digests/${{ matrix.variant }}
        run: |
          SHORT_SHA="${{ github.event.workflow_run.head_sha }}"
          SHORT_SHA="${SHORT_SHA:0:7}"
          TAGS="-t ${{ env.IMAGE }}:${{ matrix.variant }} -t ${{ env.IMAGE }}:${{ matrix.variant }}-${SHORT_SHA}"
          DIGESTS=$(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools create $TAGS $DIGESTS
