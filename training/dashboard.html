<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hexchess evaluation</title>
<link rel="icon" type="image/png" href="/icon.png">
<style>
  :root {
    --bg: #ffffff;
    --bg-subtle: #fafafa;
    --bg-muted: #f4f4f4;
    --bg-invert: #111111;
    --border: #e4e4e4;
    --border-strong: #d0d0d0;
    --text: #111111;
    --text-secondary: #555555;
    --text-muted: #666666;
    --text-invert: #ffffff;
    --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Consolas', monospace;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: var(--mono);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
    line-height: 1.55;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  .shell {
    max-width: 1280px;
    margin: 0 auto;
    padding: 24px 24px 64px;
  }

  /* --- Hero --- */
  .hero {
    padding: 4px 0 24px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 24px;
  }

  .hero-top {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: flex-start;
  }

  .eyebrow {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 10px;
  }

  .hero h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1.2;
    color: var(--text);
    max-width: 760px;
  }

  .hero-sub {
    margin-top: 10px;
    max-width: 760px;
    font-size: 12px;
    line-height: 1.55;
    color: var(--text-muted);
  }

  .hero-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }

  .pill {
    display: inline-flex;
    align-items: center;
    padding: 3px 8px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--bg);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .pill.pass { background: var(--bg-invert); color: var(--text-invert); border-color: var(--bg-invert); }
  .pill.pending { background: var(--bg); color: var(--text); border-color: var(--text); }
  .pill.fail { background: var(--bg); color: var(--text-muted); border-color: var(--border-strong); }

  .hero-strip {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin-top: 20px;
  }

  .stat {
    padding: 14px 16px;
    background: var(--bg);
  }

  .stat-label {
    display: block;
    margin-bottom: 8px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  .stat-value {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--text);
  }

  .stat-meta {
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 11px;
    line-height: 1.45;
  }

  /* --- Layout --- */
  .grid {
    display: grid;
    grid-template-columns: 1.2fr 0.8fr;
    gap: 12px;
  }

  .stack {
    display: grid;
    gap: 12px;
    align-content: start;
  }

  /* --- Panels --- */
  .panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--bg);
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: center;
    padding: 12px 16px;
    background: var(--bg-subtle);
    border-bottom: 1px solid var(--border);
  }

  .panel-title {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text);
  }

  .panel-sub {
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .panel-body {
    padding: 16px;
  }

  /* --- Summary mini-grid --- */
  .summary-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
    margin-bottom: 16px;
  }

  .mini {
    padding: 12px 14px;
    background: var(--bg);
  }

  .mini .label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .mini .value {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.03em;
    line-height: 1;
    color: var(--text);
  }

  .mini .meta {
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 11px;
  }

  /* --- Meter --- */
  .meter { margin-top: 12px; }

  .meter-track {
    height: 6px;
    border-radius: 3px;
    background: var(--bg-muted);
    position: relative;
    overflow: hidden;
    margin-top: 8px;
  }

  .meter-fill {
    position: absolute;
    inset: 0 auto 0 0;
    background: var(--text);
  }

  .bar-list {
    display: grid;
    gap: 10px;
  }

  .bar-row {
    display: grid;
    gap: 6px;
  }

  .bar-meta {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .bar-track {
    height: 5px;
    border-radius: 3px;
    background: var(--bg-muted);
    overflow: hidden;
  }

  .bar-fill {
    height: 100%;
    background: var(--text);
  }

  .chart-wrap {
    margin-bottom: 12px;
  }

  .chart {
    width: 100%;
    height: 112px;
    background: var(--bg-muted);
    border-radius: 4px;
    display: block;
  }

  .chart-legend {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 6px;
    color: var(--text-muted);
    font-size: 11px;
  }

  .dim {
    color: var(--text-muted);
  }

  /* --- Rows --- */
  .row-list {
    display: grid;
    gap: 6px;
  }

  .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
  }

  .row strong {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text);
  }

  .row span {
    display: block;
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 3px;
  }

  .row .right {
    text-align: right;
    min-width: 120px;
  }

  /* --- Key/value --- */
  .kv {
    display: grid;
  }

  .kv-line {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 8px 0;
    border-bottom: 1px solid var(--bg-muted);
  }

  .kv-line:first-child { padding-top: 0; }
  .kv-line:last-child {
    padding-bottom: 0;
    border-bottom: 0;
  }

  .kv-key {
    color: var(--text-muted);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .kv-value {
    text-align: right;
    font-size: 12px;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* --- Tables --- */
  table {
    width: 100%;
    border-collapse: collapse;
  }

  th {
    text-align: left;
    padding: 8px 10px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--text-muted);
    border-bottom: 2px solid var(--text);
  }

  td {
    padding: 8px 10px;
    font-size: 12px;
    color: var(--text);
    border-bottom: 1px solid var(--bg-muted);
    font-variant-numeric: tabular-nums;
    vertical-align: top;
  }

  tr:last-child td { border-bottom: 0; }
  tbody tr:hover td { background: var(--bg-subtle); }
  td.r, th.r { text-align: right; }

  /* --- Tags --- */
  .tag {
    display: inline-flex;
    align-items: center;
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--bg);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .tag.pass { background: var(--bg-invert); color: var(--text-invert); border-color: var(--bg-invert); }
  .tag.pending { background: var(--bg); color: var(--text); border-color: var(--text); }
  .tag.fail { background: var(--bg); color: var(--text-muted); border-color: var(--border-strong); }

  /* --- Empty --- */
  .empty {
    padding: 16px;
    border: 1px dashed var(--border);
    border-radius: 6px;
    color: var(--text-muted);
    font-size: 12px;
    font-style: italic;
    text-align: center;
  }

  .mono { font-family: var(--mono); }

  /* --- Responsive --- */
  @media (max-width: 1080px) {
    .hero-top,
    .grid {
      grid-template-columns: 1fr;
    }
    .hero-meta {
      align-items: flex-start;
      flex-direction: row;
      flex-wrap: wrap;
    }
    .hero-strip {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (max-width: 720px) {
    .shell { padding: 16px 14px 36px; }
    .hero-strip,
    .summary-grid {
      grid-template-columns: 1fr;
    }
    th:nth-child(4), td:nth-child(4),
    th:nth-child(5), td:nth-child(5),
    th:nth-child(6), td:nth-child(6) {
      display: none;
    }
  }
</style>
</head>
<body>
<div class="shell" id="app"></div>

<script>
const REFRESH_MS = 60000;

function fmt(n, digits = 0) {
  if (n == null || Number.isNaN(n)) return '\u2014';
  if (typeof n === 'number') {
    return digits ? n.toLocaleString(undefined, { minimumFractionDigits: digits, maximumFractionDigits: digits }) : n.toLocaleString();
  }
  return String(n);
}

function esc(value) {
  return String(value ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;',
    "'": '&#39;'
  }[ch]));
}

function ago(ts) {
  if (!ts) return '\u2014';
  const seconds = (Date.now() - new Date(ts).getTime()) / 1000;
  if (!Number.isFinite(seconds)) return '\u2014';
  if (seconds < 60) return `${Math.max(0, Math.floor(seconds))}s ago`;
  if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
  if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
  return `${Math.floor(seconds / 86400)}d ago`;
}

function statusClass(status) {
  if (['approved', 'promote', 'promoted', 'baseline_ready', 'complete', 'baseline'].includes(status)) return 'pass';
  if (['rejected', 'rejected_pending', 'fail'].includes(status)) return 'fail';
  return 'pending';
}

function statusLabel(status) {
  if (!status) return 'pending';
  if (status === 'approved') return 'pass';
  if (status === 'rejected') return 'fail';
  if (status === 'rejected_pending') return 'failing, collecting';
  if (status === 'promote') return 'ready';
  if (status === 'baseline_ready') return 'baseline ready';
  if (status === 'baseline') return 'approved';
  return status.replaceAll('_', ' ');
}

function pct(n, d) {
  if (!d || !Number.isFinite(n)) return 0;
  return Math.max(0, Math.min(100, Math.round((n / d) * 100)));
}

function latestSummary(data) {
  const summaries = data.trainer_metrics?.summaries || [];
  return summaries.length ? summaries[summaries.length - 1] : {};
}

function isActiveCandidate(data, focus) {
  const approvedVersion = Number(data.approved_model?.version || 0);
  return !!(focus && Number(focus.version || 0) > approvedVersion);
}

function benchmarkBudget(benchmark) {
  const entries = Object.values(benchmark?.per_opponent || {});
  return entries.reduce((sum, entry) => sum + Number(entry.budget_games || 0), 0);
}

function benchmarkCompleted(benchmark) {
  const entries = Object.values(benchmark?.per_opponent || {});
  return entries.reduce((sum, entry) => sum + Number(entry.games || 0), 0);
}

function totalLoss(entry) {
  if (entry.loss_total != null) return Number(entry.loss_total);
  return ['loss_policy', 'loss_value', 'loss_mlh', 'loss_stv', 'loss_aux']
    .reduce((sum, key) => sum + Number(entry[key] || 0), 0);
}

function trainerState(data) {
  const live = data.trainer_live_weights || {};
  const resume = data.trainer_resume_checkpoint || {};
  const summary = latestSummary(data);
  const selfplay = data.data?.selfplay || {};
  const model = data.model || {};
  const approved = data.approved_model || {};
  const threshold = Number(data.config?.promote_every_new_positions || 0);
  const nTotal = Math.max(
    Number(live.n_total || 0),
    Number(resume.n_total || 0),
    Number(summary.n_total || 0),
    Number(selfplay.total_positions || 0)
  );
  const watermark = Number(
    live.positions_at_last_promote ??
    resume.positions_at_last_promote ??
    approved.positions_at_promote ??
    model.positions_at_promote ??
    0
  );
  const fresh = Math.max(0, nTotal - watermark);
  return { live, resume, summary, nTotal, watermark, fresh, threshold };
}

function renderHeader(data, focus) {
  const model = data.model || {};
  const approved = data.approved_model || {};
  const decision = (focus && focus.decision) || {};
  const gate = (focus && focus.gate) || {};
  const benchmark = (focus && focus.benchmark) || {};
  const focusVersion = focus ? focus.version : null;
  const active = isActiveCandidate(data, focus);
  const state = trainerState(data);
  const benchBudget = benchmarkBudget(benchmark);
  const benchDone = benchmarkCompleted(benchmark);

  const headline = active
    ? `v${focusVersion} is on trial`
    : approved.version
      ? `v${approved.version} is approved`
      : 'waiting for the first approved model';

  const sub = active
    ? `The service is only tracking one decision path: candidate v${focusVersion} against approved v${approved.version}. Gate evidence and anchor regressions below are the promotion record.`
    : 'No immutable snapshot is currently ahead of the approved model. This view shows the approved anchor fingerprint, trainer cadence, and data freshness.';

  const primaryStatus = active ? decision.status : 'baseline';

  return `
    <section class="hero">
      <div class="hero-top">
        <div>
          <div class="eyebrow">Hexchess Evaluation Service</div>
          <h1>${headline}</h1>
          <div class="hero-sub">${sub}</div>
        </div>
        <div class="hero-meta">
          <div class="pill ${statusClass(primaryStatus)}">${statusLabel(primaryStatus)}</div>
          <div class="pill">latest v${fmt(model.version)}</div>
          <div class="pill">approved v${fmt(approved.version)}</div>
          <div class="pill">synced ${ago(data.timestamp)}</div>
        </div>
      </div>
      <div class="hero-strip">
        <div class="stat">
          <div class="stat-label">${active ? 'Current Candidate' : 'Approved Model'}</div>
          <div class="stat-value">${active ? `v${focusVersion}` : approved.version ? `v${approved.version}` : '\u2014'}</div>
          <div class="stat-meta">${active ? `decision ${statusLabel(decision.status)}` : approved.promoted_at ? `approved ${ago(approved.promoted_at)}` : 'approved pointer not published'}</div>
        </div>
        <div class="stat">
          <div class="stat-label">${active ? 'Gate Record' : 'Fresh Self-play'}</div>
          <div class="stat-value">${active ? (gate.games ? `${fmt(gate.wins)}-${fmt(gate.losses)}-${fmt(gate.draws)}` : '\u2014') : fmt(state.fresh)}</div>
          <div class="stat-meta">${active ? (gate.games ? `score ${fmt(gate.score, 3)} over ${fmt(gate.games)} games` : 'no gate games yet') : state.threshold ? `${fmt(state.threshold)} needed for the next candidate` : 'candidate threshold unavailable'}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Anchor Coverage</div>
          <div class="stat-value">${benchBudget ? `${fmt(benchDone)}/${fmt(benchBudget)}` : benchmark.games ? fmt(benchmark.games) : '\u2014'}</div>
          <div class="stat-meta">${benchmark.status ? `${statusLabel(benchmark.status)} across fixed anchors` : 'anchor suite not started'}</div>
        </div>
        <div class="stat">
          <div class="stat-label">Trainer Summary</div>
          <div class="stat-value">${state.summary.summary ? `#${fmt(state.summary.summary)}` : '\u2014'}</div>
          <div class="stat-meta">${state.summary.ts ? `${fmt(state.summary.steps || 0)} steps, ${ago(state.summary.ts)}` : 'no trainer summary yet'}</div>
        </div>
      </div>
    </section>
  `;
}

function renderGate(focus) {
  const gate = focus && focus.gate;
  if (!gate) {
    return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Gate</div><div class="panel-sub">Direct candidate vs approved evidence</div></div></div><div class="panel-body"><div class="empty">No gate summary for the focused version yet.</div></div></section>`;
  }

  const confidence = gate.confidence || {};
  const sprt = gate.sprt || {};
  const budget = gate.budget_games || 100;
  const progress = pct(gate.games || 0, budget);
  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Gate</div>
          <div class="panel-sub">Candidate ${gate.candidate} vs approved ${gate.approved}</div>
        </div>
        <span class="tag ${statusClass(gate.status)}">${statusLabel(gate.status)}</span>
      </div>
      <div class="panel-body">
        <div class="summary-grid">
          <div class="mini">
            <div class="label">Score</div>
            <div class="value">${fmt(gate.score, 3)}</div>
            <div class="meta">${fmt(gate.wins)} wins, ${fmt(gate.losses)} losses, ${fmt(gate.draws)} draws</div>
          </div>
          <div class="mini">
            <div class="label">Confidence</div>
            <div class="value">\u00b1${fmt(confidence.ci_half_width, 3)}</div>
            <div class="meta">interval ${fmt(confidence.lower, 3)} to ${fmt(confidence.upper, 3)}</div>
          </div>
          <div class="mini">
            <div class="label">SPRT</div>
            <div class="value">${fmt(sprt.llr, 3)}</div>
            <div class="meta">${statusLabel(sprt.status)} against ${fmt(sprt.null_score, 2)} / ${fmt(sprt.alt_score, 2)}</div>
          </div>
        </div>
        <div class="meter">
          <div class="kv-line"><span class="kv-key">Games Collected</span><span class="kv-value">${fmt(gate.games)} / ${fmt(budget)}</span></div>
          <div class="meter-track"><div class="meter-fill" style="width:${progress}%"></div></div>
        </div>
        <div class="kv" style="margin-top:16px">
          <div class="kv-line"><span class="kv-key">Paired Buckets</span><span class="kv-value mono">${Object.entries(gate.pair_buckets || {}).map(([k, v]) => `${k}:${v}`).join(' ')}</span></div>
          <div class="kv-line"><span class="kv-key">Color Split</span><span class="kv-value">white ${fmt(gate.color_split?.candidate_white?.games || 0)} / black ${fmt(gate.color_split?.candidate_black?.games || 0)}</span></div>
          <div class="kv-line"><span class="kv-key">Move Time</span><span class="kv-value">${fmt(gate.move_time_stats?.candidate_seconds_per_move, 3)}s/move candidate</span></div>
        </div>
      </div>
    </section>
  `;
}

function renderApprovedOverview(data, focus) {
  const model = data.model || {};
  const approved = data.approved_model || {};
  const state = trainerState(data);
  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Approved Pointer</div>
          <div class="panel-sub">Workers follow the approved model, not the latest candidate export</div>
        </div>
        <span class="tag pass">approved</span>
      </div>
      <div class="panel-body">
        <div class="kv">
          <div class="kv-line"><span class="kv-key">Approved Version</span><span class="kv-value">v${fmt(approved.version)}</span></div>
          <div class="kv-line"><span class="kv-key">Latest Export</span><span class="kv-value">v${fmt(model.version)}</span></div>
          <div class="kv-line"><span class="kv-key">Approved At</span><span class="kv-value">${ago(approved.promoted_at)}</span></div>
          <div class="kv-line"><span class="kv-key">Trainer Watermark</span><span class="kv-value">${fmt(state.watermark)} positions</span></div>
        </div>
      </div>
    </section>
  `;
}

function renderBenchmark(focus, active) {
  const benchmark = focus && focus.benchmark;
  if (!benchmark) {
    return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Benchmarks</div><div class="panel-sub">Fixed anchors</div></div></div><div class="panel-body"><div class="empty">No benchmark summary for the focused version yet.</div></div></section>`;
  }

  const rows = Object.values(benchmark.per_opponent || {}).map(entry => {
    const budget = entry.budget_games || 0;
    const progress = pct(entry.games || 0, budget);
    return `
    <tr>
      <td><strong>${esc(entry.opponent)}</strong><br><span class="mono">${statusLabel(entry.status)}</span></td>
      <td class="r">${fmt(entry.score, 3)}</td>
      <td class="r">${entry.reference_score == null ? '\u2014' : fmt(entry.reference_score, 3)}</td>
      <td class="r">${entry.target_score == null ? '\u2014' : fmt(entry.target_score, 3)}</td>
      <td class="r">${fmt(entry.games)} / ${fmt(budget)}</td>
      <td class="r">${progress}%</td>
    </tr>
  `}).join('');

  const title = benchmark.reference_available ? 'Anchor Regression' : 'Anchor Fingerprint';
  const sub = benchmark.reference_available
    ? 'Candidate must stay within fixed-anchor tolerance from the approved reference'
    : active
      ? 'Collecting anchor scores before a reference exists'
      : 'Approved model scores against fixed anchors';

  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">${title}</div>
          <div class="panel-sub">${sub}</div>
        </div>
        <span class="tag ${statusClass(benchmark.status)}">${statusLabel(benchmark.status)}</span>
      </div>
      <div class="panel-body">
        <div class="summary-grid">
          <div class="mini">
            <div class="label">Aggregate Score</div>
            <div class="value">${fmt(benchmark.score, 3)}</div>
            <div class="meta">${fmt(benchmark.games)} total games</div>
          </div>
          <div class="mini">
            <div class="label">Regression Rule</div>
            <div class="value">${benchmark.reference_available ? 'active' : 'baseline'}</div>
            <div class="meta">${benchmark.reference_available ? 'floors are reference minus tolerance' : 'scores define future reference floors'}</div>
          </div>
          <div class="mini">
            <div class="label">Avg Length</div>
            <div class="value">${fmt(benchmark.move_time_stats?.average_game_length_moves, 1)}</div>
            <div class="meta">${Object.entries(benchmark.termination_mix || {}).map(([k, v]) => `${k}:${v}`).join(' ') || 'no games yet'}</div>
          </div>
        </div>
        <table>
          <thead>
            <tr>
              <th>Anchor</th>
              <th class="r">Score</th>
              <th class="r">Reference</th>
              <th class="r">Floor</th>
              <th class="r">Games</th>
              <th class="r">Done</th>
            </tr>
          </thead>
          <tbody>${rows || `<tr><td colspan="6" class="empty">No anchor data yet.</td></tr>`}</tbody>
        </table>
      </div>
    </section>
  `;
}

function renderDecision(data, focus, active) {
  const decision = (focus && focus.decision) || {};
  if (!active) {
    const state = trainerState(data);
    return `
      <section class="panel">
        <div class="panel-head">
          <div>
            <div class="panel-title">Trainer Cadence</div>
            <div class="panel-sub">Fresh self-play gate for the next candidate export</div>
          </div>
        </div>
        <div class="panel-body">
          ${renderCadenceBody(state, data)}
        </div>
      </section>
    `;
  }

  const reasons = (decision.reasons || []).map(reason => `
    <div class="row">
      <div><strong>${esc(reason)}</strong></div>
      <div class="right"><span>${ago(decision.updated_at)}</span></div>
    </div>
  `).join('');

  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Decision</div>
          <div class="panel-sub">Promotion result for the focused version</div>
        </div>
        <span class="tag ${statusClass(decision.status)}">${statusLabel(decision.status)}</span>
      </div>
      <div class="panel-body">
        <div class="kv">
          <div class="kv-line"><span class="kv-key">Candidate</span><span class="kv-value">${decision.candidate || '\u2014'}</span></div>
          <div class="kv-line"><span class="kv-key">Gate</span><span class="kv-value">${statusLabel(decision.gate_status)}</span></div>
          <div class="kv-line"><span class="kv-key">Benchmarks</span><span class="kv-value">${statusLabel(decision.benchmark_status)}</span></div>
          <div class="kv-line"><span class="kv-key">Updated</span><span class="kv-value">${ago(decision.updated_at)}</span></div>
        </div>
        <div class="row-list" style="margin-top:16px">
          ${reasons || '<div class="empty">No decision reasons recorded yet.</div>'}
        </div>
      </div>
    </section>
  `;
}

function candidatePoints(game) {
  const candidate = game.candidate;
  if (!candidate) return '\u2014';
  if (game.outcome === 'draw') return '0.5';
  const candidateWon = (game.outcome === 'white' && game.white === candidate) ||
    (game.outcome === 'black' && game.black === candidate);
  return candidateWon ? '1.0' : '0.0';
}

function renderGames(data) {
  const games = data.recent_games || [];
  if (!games.length) {
    return `<section class="panel"><div class="panel-head"><div><div class="panel-title">Recent Games</div><div class="panel-sub">Immutable evaluation records</div></div></div><div class="panel-body"><div class="empty">No evaluation games have been recorded for the focused version yet.</div></div></section>`;
  }
  const shown = [...games].reverse().slice(0, 18);
  const rows = shown.map(game => `
    <tr>
      <td><span class="tag ${statusClass(game.eval_type)}">${esc(game.eval_type)}</span></td>
      <td>${esc(game.white)} vs ${esc(game.black)}<br><span class="mono">pair ${esc(game.pair_id || '\u2014')} / game ${game.pair_game_index ?? '\u2014'}</span></td>
      <td class="r">${esc(game.outcome)}<br><span class="dim">candidate ${candidatePoints(game)}</span></td>
      <td class="r">${fmt(game.moves)}</td>
      <td class="r">${esc(game.termination || '\u2014')}<br><span class="dim">${fmt((game.white_time || 0) + (game.black_time || 0), 1)}s</span></td>
      <td class="r">${ago(game.timestamp)}</td>
    </tr>
  `).join('');
  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Recent Games</div>
          <div class="panel-sub">Latest ${fmt(shown.length)} immutable records under the focused evaluation version</div>
        </div>
      </div>
      <div class="panel-body">
        <table>
          <thead>
            <tr>
              <th>Type</th>
              <th>Players</th>
              <th class="r">Outcome</th>
              <th class="r">Moves</th>
              <th class="r">End</th>
              <th class="r">Age</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </section>
  `;
}

function renderVersions(data) {
  const evals = data.evaluations || {};
  const summaries = evals.summaries || {};
  const approvedVersion = Number(data.approved_model?.version || 0);
  const rows = (evals.versions || []).slice().reverse().map(version => {
    const summary = summaries[`v${version}`] || {};
    const decision = summary.decision || {};
    const gate = summary.gate || {};
    const benchmark = summary.benchmark || {};
    const isBaseline = Number(version) <= approvedVersion && ['promoted', 'baseline_ready', 'complete'].includes(decision.status);
    const gateText = isBaseline
      ? 'baseline'
      : gate.games == null
        ? 'no gate'
        : `${fmt(gate.games)}/${fmt(gate.budget_games || 100)} gate`;
    const benchText = benchmark.games == null ? 'no anchors' : `${fmt(benchmark.games)}/${fmt(benchmarkBudget(benchmark) || benchmark.games)} anchors`;
    const rowStatus = Number(version) === approvedVersion ? 'approved' : statusLabel(decision.status);
    return `
      <div class="row">
        <div>
          <strong>v${version}</strong>
          <span>${gateText} · ${benchText}</span>
        </div>
        <div class="right">
          <strong>${rowStatus}</strong>
          <span>${ago(decision.updated_at)}</span>
        </div>
      </div>
    `;
  }).join('');
  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Version History</div>
          <div class="panel-sub">Latest evaluation artifacts by version</div>
        </div>
      </div>
      <div class="panel-body">
        <div class="row-list">
          ${rows || '<div class="empty">No evaluation summaries found yet.</div>'}
        </div>
      </div>
    </section>
  `;
}

function renderWorkers(data) {
  const workers = Object.entries(data.workers || {});
  const rows = workers
    .sort((a, b) => String(a[0]).localeCompare(String(b[0])))
    .map(([name, info]) => `
    <div class="row">
      <div>
        <strong>${esc(name)}</strong>
        <span>model v${fmt(info.model_version)} · ${fmt(info.total_games)} games</span>
      </div>
      <div class="right">
        <strong>${ago(info.timestamp)}</strong>
        <span>${esc(info.hostname || '')}</span>
      </div>
    </div>
  `).join('');

  const selfplay = data.data?.selfplay || {};
  const imitation = data.data?.imitation || {};
  const byVersion = Object.entries(selfplay.by_version || {})
    .sort((a, b) => Number(String(b[0]).replace('v', '')) - Number(String(a[0]).replace('v', '')))
    .map(([version, entry]) => `
      <div class="bar-row">
        <div class="bar-meta"><strong>${esc(version)}</strong><span>${fmt(entry.positions)} positions · ${fmt(entry.count)} files</span></div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct(entry.positions || 0, selfplay.total_positions || 0)}%"></div></div>
      </div>
    `).join('');

  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Throughput</div>
          <div class="panel-sub">Training data and worker liveness</div>
        </div>
      </div>
      <div class="panel-body">
        <div class="summary-grid">
          <div class="mini">
            <div class="label">Self-play</div>
            <div class="value">${fmt(selfplay.total_positions || 0)}</div>
            <div class="meta">${fmt(selfplay.total_files || 0)} files</div>
          </div>
          <div class="mini">
            <div class="label">Imitation</div>
            <div class="value">${fmt(imitation.total_positions || 0)}</div>
            <div class="meta">${fmt(imitation.total_files || 0)} files</div>
          </div>
          <div class="mini">
            <div class="label">Workers</div>
            <div class="value">${fmt(workers.length)}</div>
            <div class="meta">active heartbeats</div>
          </div>
        </div>
        <div class="row-list">
          ${rows || '<div class="empty">No worker heartbeats available.</div>'}
        </div>
        <div class="bar-list" style="margin-top:16px">
          ${byVersion || '<div class="empty">No self-play version breakdown available.</div>'}
        </div>
      </div>
    </section>
  `;
}

function renderCadenceBody(state, data) {
  const progress = pct(state.fresh, state.threshold);
  const summarySteps = data.config?.summary_interval_steps;
  return `
    <div class="summary-grid">
      <div class="mini">
        <div class="label">Fresh Positions</div>
        <div class="value">${fmt(state.fresh)}</div>
        <div class="meta">since ${fmt(state.watermark)} watermark</div>
      </div>
      <div class="mini">
        <div class="label">Next Candidate</div>
        <div class="value">${state.threshold ? `${progress}%` : '\u2014'}</div>
        <div class="meta">${state.threshold ? `${fmt(Math.max(0, state.threshold - state.fresh))} positions remaining` : 'threshold unavailable'}</div>
      </div>
      <div class="mini">
        <div class="label">Bucket</div>
        <div class="value">${fmt(state.resume.bucket_tokens, 0)}</div>
        <div class="meta">${summarySteps ? `${fmt(summarySteps)} steps per summary` : 'summary cadence unavailable'}</div>
      </div>
    </div>
    <div class="meter">
      <div class="kv-line"><span class="kv-key">Candidate Progress</span><span class="kv-value">${fmt(state.fresh)} / ${fmt(state.threshold)}</span></div>
      <div class="meter-track"><div class="meter-fill" style="width:${progress}%"></div></div>
    </div>
    <div class="kv" style="margin-top:16px">
      <div class="kv-line"><span class="kv-key">Live Weights</span><span class="kv-value">${state.live.timestamp ? `${ago(state.live.timestamp)} at summary #${fmt(state.live.summary)}` : '\u2014'}</span></div>
      <div class="kv-line"><span class="kv-key">Total Trainer Steps</span><span class="kv-value">${fmt(state.live.total_steps ?? state.resume.total_steps_all_time ?? state.summary.total_steps)}</span></div>
      <div class="kv-line"><span class="kv-key">Self-play Total</span><span class="kv-value">${fmt(state.nTotal)}</span></div>
    </div>
  `;
}

function renderCadence(data) {
  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Trainer Cadence</div>
          <div class="panel-sub">Candidate export progress from live trainer metadata</div>
        </div>
      </div>
      <div class="panel-body">
        ${renderCadenceBody(trainerState(data), data)}
      </div>
    </section>
  `;
}

function renderLossChart(summaries) {
  if (summaries.length < 2) return '';
  const W = 320, H = 100, PAD = 4;
  const totals = summaries.map(totalLoss);
  const rawMn = Math.min(...totals), rawMx = Math.max(...totals);
  const spread = Math.max(0.01, rawMx - rawMn);
  const mn = rawMn - spread * 0.08, mx = rawMx + spread * 0.08;
  const scaleX = i => PAD + i / (totals.length - 1) * (W - 2 * PAD);
  const scaleY = v => H - PAD - (v - mn) / (mx - mn) * (H - 2 * PAD);
  const pts = totals.map((v, i) => `${scaleX(i).toFixed(1)},${scaleY(v).toFixed(1)}`).join(' ');
  const latest = totals[totals.length - 1];
  const oldest = totals[0];
  const delta = latest - oldest;
  const trend = delta < -0.01 ? 'down' : delta > 0.01 ? 'up' : 'flat';
  return `
    <div class="chart-wrap">
      <svg viewBox="0 0 ${W} ${H}" class="chart">
        <polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="1.5" stroke-linejoin="round"/>
        <circle cx="${scaleX(totals.length-1)}" cy="${scaleY(latest)}" r="3" fill="var(--text)"/>
      </svg>
      <div class="chart-legend">
        <span>total loss ${latest.toFixed(3)} (${trend}, delta ${delta.toFixed(3)})</span>
        <span>${summaries.length} summaries</span>
      </div>
    </div>`;
}

function renderTrainer(data) {
  const summaries = data.trainer_metrics?.summaries || [];
  const chart = renderLossChart(summaries);
  const rows = summaries.slice(-6).reverse().map(entry => {
    const total = totalLoss(entry).toFixed(3);
    return `
    <div class="row">
      <div>
        <strong>#${fmt(entry.summary)}</strong>
        <span>v${fmt(entry.version)} · total ${total} · P ${fmt(entry.loss_policy, 3)} V ${fmt(entry.loss_value, 3)} MLH ${fmt(entry.loss_mlh, 3)} STV ${fmt(entry.loss_stv, 3)} Aux ${fmt(entry.loss_aux, 3)}</span>
      </div>
      <div class="right">
        <strong>${fmt(entry.steps)}</strong>
        <span>${ago(entry.ts)}</span>
      </div>
    </div>`;
  }).join('');

  return `
    <section class="panel">
      <div class="panel-head">
        <div>
          <div class="panel-title">Trainer</div>
          <div class="panel-sub">Published summaries across all training heads</div>
        </div>
      </div>
      <div class="panel-body">
        ${chart}
        <div class="row-list">
          ${rows || '<div class="empty">No trainer summaries available yet.</div>'}
        </div>
      </div>
    </section>
  `;
}

function render(data) {
  const focus = data.evaluations?.focus || null;
  const active = isActiveCandidate(data, focus);
  document.getElementById('app').innerHTML = `
    ${renderHeader(data, focus)}
    <div class="grid">
      <div class="stack">
        ${active ? renderGate(focus) : renderApprovedOverview(data, focus)}
        ${renderBenchmark(focus, active)}
        ${renderGames(data)}
      </div>
      <div class="stack">
        ${renderDecision(data, focus, active)}
        ${active ? renderCadence(data) : ''}
        ${renderWorkers(data)}
        ${renderTrainer(data)}
        ${renderVersions(data)}
      </div>
    </div>
  `;
}

async function refresh() {
  const res = await fetch('/api/status', { cache: 'no-store' });
  const data = await res.json();
  render(data);
}

refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
